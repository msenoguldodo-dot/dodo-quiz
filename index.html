<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF4E00">
<title>Dodo Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Dodo Pizza Türkiye tasarım sistemi:
   renk oranı 50–100% yanık turuncu · 25–50% nötr (bej, kül siyahı) · 0–15% neon vurgu
   yüzey başına iki renk · köşe: 30 panel / 20 buton / 15 kart / 14 etiket / hap
   düz dolgu, gölge yok · Rooftop (yoksa Rubik) 500 + 800 */
:root{
  --orange:#FF4E00; --beige:#F5F3EF; --ash:#151D28; --neon:#D1FE3C; --white:#FFFFFF;
  --ash-2:#232C39;            /* kül panel içinde pasif yüzey */
  --ash-3:#5B6370;            /* pasif metin */
  --font:"Rooftop","Rubik",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --r-panel:30px; --r-promo:25px; --r-btn:20px; --r-card:15px; --r-label:14px; --r-pill:999px;
  --lh-tight:.9; --lh-display:.96; --lh-body:1.12;
  --tr-display:-0.03em; --tr-body:-0.02em;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-weight:500;color:var(--ash);background:var(--orange);letter-spacing:var(--tr-body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#app{min-height:100%;display:flex;flex-direction:column}
#app>*{flex:1}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- brand atoms ---------- */
.logo{display:block;height:var(--logo-h,44px);width:auto;flex:none}
.logo .b{fill:var(--beige)} .logo .o{fill:var(--orange)} .logo .a{fill:var(--ash)}
.logo-img{height:var(--logo-h,44px);width:auto;max-width:220px;object-fit:contain;display:block}
.num{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;font-weight:800;line-height:1;flex:none;font-size:1em}
.label{display:inline-flex;align-items:center;gap:.4em;border-radius:var(--r-label);padding:.42em .75em .46em;font-weight:800;line-height:var(--lh-tight);white-space:nowrap}
.label.neon{background:var(--neon);color:var(--ash)}
.label.beige{background:var(--beige);color:var(--ash)}
.label.ash{background:var(--ash);color:var(--beige)}
.label.ring{box-shadow:inset 0 0 0 2px currentColor}
.btn{border-radius:var(--r-btn);padding:.78em 1.25em .82em;font-weight:800;font-size:1.05rem;line-height:var(--lh-tight);text-transform:lowercase;transition:background-color .12s,color .12s}
.btn.ash{background:var(--ash);color:var(--beige)}
.btn.ash:hover{background:var(--beige);color:var(--ash)}
.btn.orange{background:var(--orange);color:var(--beige)}
.btn.orange:hover{background:var(--ash)}
.btn.beige{background:var(--beige);color:var(--ash)}
.btn.beige:hover{background:var(--ash);color:var(--beige)}
.btn.line{box-shadow:inset 0 0 0 2px currentColor}
.btn.big{font-size:1.35rem;padding:.8em 1.5em .85em}
.btn:disabled{background:var(--ash-2);color:var(--ash-3);cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ash);color:var(--beige);padding:.8em 1.2em;border-radius:var(--r-label);font-weight:800;z-index:50;max-width:calc(100% - 32px)}

/* answer slots: ➀ turuncu · ➁ neon · ➂ bej · ➃ halka — kül zemin üzerinde */
.s0{background:var(--orange);color:var(--beige)}
.s1{background:var(--neon);color:var(--ash)}
.s2{background:var(--beige);color:var(--ash)}
.s3{background:var(--ash);color:var(--beige);box-shadow:inset 0 0 0 4px var(--beige)}
.s0 .num{background:var(--beige);color:var(--orange)}
.s1 .num{background:var(--ash);color:var(--neon)}
.s2 .num{background:var(--orange);color:var(--beige)}
.s3 .num{background:var(--beige);color:var(--ash)}

/* ================= EDITOR (sunucunun hazırlık ekranı) ================= */
.ed{background:var(--beige);min-height:100%;display:flex;flex-direction:column}
.ed-top{background:var(--orange);padding-block:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.ed-top .t{color:var(--beige);font-weight:800;font-size:1.05rem;text-transform:lowercase}
.ed-top .sp{flex:1}
.ed-wrap{width:100%;max-width:980px;margin:0 auto;padding-block:28px 130px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.ed-hero{background:var(--orange);color:var(--beige);border-radius:var(--r-panel);padding:28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
@media (max-width:640px){.ed-hero{grid-template-columns:1fr}}
.ed-hero .eyebrow{font-weight:800;font-size:.95rem;letter-spacing:.06em}
.ed-title{width:100%;border:0;background:transparent;color:var(--beige);font-weight:800;font-size:clamp(1.8rem,4vw,3rem);line-height:var(--lh-display);letter-spacing:var(--tr-display);padding:.1em 0;border-bottom:3px solid transparent}
.ed-title:focus{outline:none;border-bottom-color:var(--beige)}
.ed-hero .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ed-card{background:var(--white);border-radius:var(--r-card);padding:18px;display:grid;gap:12px}
.ed-card.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ed-card.tools .note{flex:1;min-width:220px;color:var(--ash);font-size:.92rem;line-height:var(--lh-body)}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhead .sp{flex:1}
.qno{font-weight:800;color:var(--orange);font-size:1.5rem;line-height:1;min-width:1.6em}
.ico{width:38px;height:38px;border-radius:var(--r-label);background:var(--beige);color:var(--ash);font-weight:800;font-size:1rem}
.ico:hover{background:var(--ash);color:var(--beige)}
select{border:0;border-radius:var(--r-label);padding:9px 12px;font-weight:800;background:var(--beige);color:var(--ash)}
.qtext{width:100%;min-height:62px;resize:vertical;border:0;border-radius:var(--r-card);padding:12px 14px;font-size:1.15rem;font-weight:800;background:var(--beige);line-height:var(--lh-body)}
.qtext:focus,.ainput:focus{outline:2px solid var(--orange);outline-offset:0}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.agrid{grid-template-columns:1fr}}
.aopt{display:flex;align-items:center;gap:8px;border-radius:var(--r-card);padding:6px;background:var(--beige)}
.aopt .num{font-size:1.05rem}
.aopt.s0 .num{background:var(--orange);color:var(--beige)}
.aopt.s1 .num{background:var(--neon);color:var(--ash)}
.aopt.s2 .num{background:var(--ash);color:var(--beige)}
.aopt.s3 .num{background:var(--white);color:var(--ash);box-shadow:inset 0 0 0 2px var(--ash)}
.aopt{color:var(--ash)}
.aopt.s0,.aopt.s1,.aopt.s2,.aopt.s3{background:var(--beige);box-shadow:none}
.ainput{flex:1;min-width:0;border:0;border-radius:10px;padding:9px 10px;font-weight:800;background:var(--white)}
.okbtn{flex:none;border-radius:var(--r-label);padding:.5em .7em;font-weight:800;font-size:.85rem;text-transform:lowercase;background:var(--white);color:var(--ash-3)}
.okbtn[aria-pressed="true"]{background:var(--neon);color:var(--ash)}
.add-q{border-radius:var(--r-card);padding:20px;font-weight:800;font-size:1.05rem;background:var(--orange);color:var(--beige);text-transform:lowercase}
.add-q:hover{background:var(--ash)}
.start-bar{position:fixed;left:0;right:0;bottom:0;background:var(--ash);color:var(--beige);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;z-index:5}
.start-bar .info{flex:1;min-width:0;line-height:var(--lh-body)}
.start-bar .info.err{color:var(--neon);font-weight:800}
.io-area{width:100%;min-height:160px;border:0;border-radius:var(--r-card);padding:12px;background:var(--beige);font-family:ui-monospace,Menlo,monospace;font-size:.8rem;letter-spacing:0}

/* ================= HOST STAGE (büyük ekran) ================= */
.stage{background:var(--orange);color:var(--beige);min-height:100%;display:flex;flex-direction:column;gap:clamp(14px,2vw,28px);padding-block:clamp(16px,2.2vw,40px);padding-left:max(clamp(16px,2.2vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.2vw,40px),env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;--logo-h:clamp(36px,3.4vw,56px)}
.bar .sp{flex:1}
.bar .label{font-size:clamp(.9rem,1.2vw,1.2rem)}
.fs{width:44px;height:44px;border-radius:var(--r-label);box-shadow:inset 0 0 0 2px var(--beige);color:var(--beige);font-weight:800}
.fs:hover{background:var(--beige);color:var(--orange)}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.95fr);gap:clamp(16px,2.5vw,40px);align-items:stretch}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.lobby-copy{display:flex;flex-direction:column;gap:clamp(14px,1.8vw,28px);min-width:0}
.headline{font-weight:800;font-size:clamp(2.2rem,5.4vw,6.4rem);line-height:var(--lh-display);letter-spacing:var(--tr-display);margin:0;text-wrap:balance}
.steps{display:grid;gap:10px;font-size:clamp(1.05rem,1.6vw,1.6rem);line-height:var(--lh-body)}
.steps div{display:flex;gap:.6em;align-items:baseline}
.steps b{font-weight:800}
.roster{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.roster-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.roster-head .label{font-size:clamp(1rem,1.4vw,1.4rem)}
.chips{display:flex;flex-wrap:wrap;gap:8px;max-height:30vh;overflow:hidden}
.chip{background:var(--beige);color:var(--ash);border-radius:var(--r-label);padding:.5em .85em .55em;font-weight:800;font-size:clamp(1rem,1.4vw,1.35rem);line-height:var(--lh-tight);animation:pop .25s ease-out}
.chip.off{background:transparent;color:var(--beige);box-shadow:inset 0 0 0 2px var(--beige)}
.chip:hover{background:var(--ash);color:var(--beige);text-decoration:line-through}
@keyframes pop{from{transform:scale(.7)}to{transform:none}}
.wait-note{font-size:clamp(1rem,1.3vw,1.3rem);line-height:var(--lh-body);max-width:34ch}
.lobby-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-weight:800;color:var(--ash)}

.frame{position:relative;border-radius:var(--r-panel);background:var(--ash);padding:clamp(16px,2vw,32px);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;min-height:420px;overflow:hidden}
.frame .photo{position:absolute;inset:0;background:var(--photo) center 88%/cover}
.join{position:relative;background:var(--beige);color:var(--ash);border-radius:var(--r-panel);padding:clamp(16px,1.8vw,28px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(14px,1.6vw,26px);align-items:center;width:min(100%,640px)}
@media (max-width:520px){.join{grid-template-columns:1fr}}
.qr{background:var(--white);border-radius:var(--r-card);padding:10px;line-height:0}
.qr img,.qr canvas{display:block;width:clamp(140px,13vw,220px);height:auto;aspect-ratio:1}
.join .k{font-weight:800;text-transform:lowercase;font-size:clamp(.9rem,1.1vw,1.1rem)}
.join .url{font-weight:800;color:var(--orange);font-size:clamp(1rem,1.5vw,1.5rem);line-height:var(--lh-body);overflow-wrap:anywhere;margin-top:4px}
.pin{display:inline-flex;align-items:baseline;background:var(--orange);color:var(--beige);border-radius:var(--r-pill);padding:.12em .45em .16em;font-weight:800;font-size:clamp(2.2rem,3.6vw,4.4rem);line-height:var(--lh-display);letter-spacing:.02em;margin-top:10px;max-width:100%}

/* question */
.qwrap{flex:1;display:grid;grid-template-rows:auto 1fr;gap:clamp(12px,1.6vw,24px);min-height:0}
.qcard{background:var(--beige);color:var(--ash);border-radius:var(--r-panel);padding:clamp(18px,2.4vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2vw,32px);align-items:center}
.qcard h1{margin:0;font-weight:800;font-size:clamp(1.6rem,3.6vw,4rem);line-height:var(--lh-display);letter-spacing:var(--tr-display);text-wrap:balance}
.clock{display:flex;flex-direction:column;align-items:center;gap:8px}
.clock .pill{background:var(--orange);color:var(--beige);border-radius:var(--r-pill);min-width:2.1em;padding:.1em .35em .14em;text-align:center;font-weight:800;font-size:clamp(2.6rem,5.4vw,6rem);line-height:var(--lh-display)}
.clock .pill.low{background:var(--ash);color:var(--neon)}
.clock .k{font-weight:800;text-transform:lowercase;font-size:clamp(.85rem,1vw,1.05rem)}
.apanel{background:var(--ash);border-radius:var(--r-panel);padding:clamp(12px,1.4vw,22px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.2vw,18px);align-content:stretch}
.tile{display:flex;align-items:center;gap:clamp(12px,1.4vw,22px);border-radius:var(--r-card);padding:clamp(14px,1.8vw,28px);font-weight:800;font-size:clamp(1.15rem,2.2vw,2.3rem);line-height:var(--lh-body);min-height:clamp(70px,9vh,140px);transition:background-color .2s,color .2s}
.tile .num{font-size:.9em}
.tile .t{flex:1;min-width:0;overflow-wrap:anywhere}
.tile .cnt{font-size:.8em}
.tile.off{background:var(--ash-2);color:var(--ash-3);box-shadow:none}
.tile.off .num{background:var(--ash);color:var(--ash-3)}
.tile.win{background:var(--neon);color:var(--ash);box-shadow:none}
.tile.win .num{background:var(--ash);color:var(--neon)}
.tile .ok{border-radius:var(--r-label);background:var(--ash);color:var(--neon);padding:.3em .6em .34em;font-size:.55em;text-transform:lowercase}
.tile .keytag{flex:none;border-radius:var(--r-label);background:var(--neon);color:var(--ash);box-shadow:inset 0 0 0 2px var(--ash);padding:.35em .65em .4em;font-size:.48em;text-transform:lowercase;line-height:1}
.btn.sm{font-size:.85rem;padding:.6em .9em}
.meter{height:10px;border-radius:var(--r-pill);background:var(--ash);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:currentColor;width:0;transition:width .7s ease-out}
.tile .col{flex:1;min-width:0}
.nextrow{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* leaderboard */
.board{flex:1;width:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.board h2{margin:0 0 6px;font-weight:800;font-size:clamp(2.2rem,5vw,5rem);line-height:var(--lh-display);letter-spacing:var(--tr-display)}
.row{display:grid;grid-template-columns:3em minmax(0,1fr) auto auto;gap:16px;align-items:center;background:var(--beige);color:var(--ash);border-radius:var(--r-card);padding:clamp(12px,1.4vw,20px) clamp(16px,1.8vw,28px);font-weight:800;font-size:clamp(1.15rem,2.2vw,2.2rem);line-height:var(--lh-tight);animation:rise .35s ease-out both}
.row .rk{color:var(--orange)}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .gain{font-size:.6em}
.row.top{background:var(--ash);color:var(--beige)}
.row.top .rk{color:var(--neon)}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}

/* podium */
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,2vw,28px)}
.pod{display:flex;flex-direction:column;align-items:center;gap:12px;width:clamp(110px,22vw,320px)}
.pod .nm{font-weight:800;font-size:clamp(1.3rem,2.8vw,2.8rem);line-height:var(--lh-display);text-align:center;overflow-wrap:anywhere}
.pod .block{width:100%;background:var(--beige);color:var(--orange);border-radius:var(--r-panel) var(--r-panel) 0 0;display:flex;justify-content:center;padding-top:.2em;font-weight:800;font-size:clamp(3rem,8vw,9rem);line-height:1;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.9,.3,1.15) both}
.pod.p1 .block{height:clamp(190px,34vh,360px);background:var(--ash);color:var(--neon);animation-delay:1.1s}
.pod.p2 .block{height:clamp(140px,24vh,260px);animation-delay:.55s}
.pod.p3 .block{height:clamp(100px,16vh,180px)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}

/* ================= PLAYER (telefon) ================= */
.ph{min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));--logo-h:34px}
.ph.orange{background:var(--orange);color:var(--beige)}
.ph.ash{background:var(--ash);color:var(--beige)}
.ph.neon{background:var(--neon);color:var(--ash)}
.ph-top{display:flex;align-items:center;gap:10px;min-height:40px}
.ph-top .sp{flex:1}
.ph-top .label{max-width:50%;overflow:hidden;text-overflow:ellipsis}
.ph-body{flex:1;display:flex;flex-direction:column;gap:14px}
.ph-hero{border-radius:var(--r-panel);background:var(--ash);padding:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:clamp(170px,30vh,260px);position:relative;overflow:hidden}
.ph-hero .photo{position:absolute;inset:0;background:var(--photo) center 78%/cover}
.ph-hero .label{position:relative}
.ph h1{margin:0;font-weight:800;font-size:clamp(2.1rem,10.5vw,3rem);line-height:var(--lh-display);letter-spacing:var(--tr-display);text-wrap:balance}
.ph p{margin:0;font-size:1.05rem;line-height:var(--lh-body);max-width:32ch}
.form{background:var(--beige);color:var(--ash);border-radius:var(--r-panel);padding:16px;display:grid;gap:10px;margin-top:auto}
.field{display:grid;gap:6px}
.field span{font-weight:800;font-size:.85rem;text-transform:lowercase}
.field input{width:100%;border:0;border-radius:var(--r-card);background:var(--white);padding:14px 16px;font-weight:800;font-size:1.35rem;line-height:1}
.field input:focus{outline:3px solid var(--orange);outline-offset:0}
.field input#pin-in{color:var(--orange);font-size:1.9rem;letter-spacing:.12em;text-align:center}
.form .btn{width:100%;font-size:1.25rem;padding:.9em}
.form .err{background:var(--ash);color:var(--neon);border-radius:var(--r-label);padding:.6em .8em;font-weight:800;line-height:var(--lh-body)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cd{background:var(--orange);color:var(--beige);border-radius:var(--r-pill);padding:.18em .55em .22em;font-weight:800;font-size:1.6rem;line-height:var(--lh-display);min-width:2.2em;text-align:center}
.cd.low{background:var(--neon);color:var(--ash)}
.ph-q{font-weight:800;font-size:1.25rem;line-height:var(--lh-body);text-wrap:balance}
.pad{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;min-height:300px}
.pad.two{grid-template-columns:1fr}
.key{border-radius:var(--r-card);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px;font-weight:800;font-size:1.08rem;line-height:var(--lh-body);text-align:left;overflow-wrap:anywhere;transition:transform .08s}
.key .num{font-size:1.6rem}
.key:active{transform:scale(.97)}
.pad.two .key{flex-direction:row;align-items:center;justify-content:flex-start;font-size:1.5rem}
.picked{display:flex;align-items:center;gap:12px;border-radius:var(--r-card);padding:14px;font-weight:800;font-size:1.15rem;line-height:var(--lh-body)}
.picked .num{font-size:1.3rem}
.big{font-weight:800;font-size:clamp(3.4rem,19vw,5.6rem);line-height:var(--lh-display);letter-spacing:var(--tr-display)}
.gainpill{align-self:flex-start;background:var(--ash);color:var(--neon);border-radius:var(--r-pill);padding:.16em .5em .2em;font-weight:800;font-size:2.4rem;line-height:var(--lh-display)}
.ph.orange .gainpill{background:var(--beige);color:var(--orange)}
.answer-card{background:var(--beige);color:var(--ash);border-radius:var(--r-card);padding:14px;display:grid;gap:6px}
.answer-card .k{font-weight:800;font-size:.85rem;text-transform:lowercase;color:var(--orange)}
.answer-card .v{font-weight:800;font-size:1.25rem;line-height:var(--lh-body)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.stat{border-radius:var(--r-card);padding:14px;display:grid;gap:4px}
.stat .k{font-weight:800;font-size:.85rem;text-transform:lowercase}
.stat .v{font-weight:800;font-size:1.8rem;line-height:1}
.ph.neon .stat{background:var(--ash);color:var(--beige)}
.ph.neon .stat .v{color:var(--neon)}
.ph.orange .stat,.ph.ash .stat{background:var(--beige);color:var(--ash)}
.ph.orange .stat .v,.ph.ash .stat .v{color:var(--orange)}
.rankpill{align-self:flex-start;background:var(--beige);color:var(--orange);border-radius:var(--r-pill);padding:.08em .4em .14em;font-weight:800;font-size:clamp(5rem,30vw,8.5rem);line-height:var(--lh-display);letter-spacing:var(--tr-display)}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function num(k) { return h("span", { class: "num", "aria-hidden": "true" }, NUMS[k] ? String(k + 1) : ""); }
function lower(t) { return String(t || "").toLocaleLowerCase("tr").replace(/pızza/g, "pizza").replace(/dodo pızza/g, "dodo pizza"); } // marka adı ı almaz
function store(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function toast(msg, ms = 2600) {

}

  return t.content.firstChild;
}

/* Mobil veride (operatör NAT'ı) doğrudan bağlantı kurulamazsa trafik ücretsiz Open Relay TURN sunucusundan geçer. */
const TURN_HOST = "staticauth.openrelay.metered.ca", TURN_SECRET = "openrelayprojectsecret";
let ICE = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];
const TURN_READY = (async () => {
  try {
    const user = (Math.floor(Date.now() / 1000) + 24 * 3600) + ":dodoquiz";
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(TURN_SECRET), { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
    const sig = new Uint8Array(await crypto.subtle.sign("HMAC", key, enc.encode(user)));
    let bin = ""; sig.forEach(b => bin += String.fromCharCode(b));
    ICE = ICE.concat([{ urls: ["turn:" + TURN_HOST + ":80", "turn:" + TURN_HOST + ":80?transport=tcp", "turn:" + TURN_HOST + ":443", "turns:" + TURN_HOST + ":443?transport=tcp"], username: user, credential: btoa(bin) }]);
  } catch (e) { /* güvenli olmayan bağlamda (http) TURN eklenmez; STUN ile devam */ }
})();
function peerOptions() {
  const srv = params.get("srv"); // yalnızca test için: ?srv=host:port
  if (srv) { const [host, port] = srv.split(":"); return { host, port: +port || 9000, path: "/", secure: false, debug: 1, config: { iceServers: ICE } }; }
  return { debug: 1, config: { iceServers: ICE } };
}

function points(elapsedMs, timeSec) { // Kahoot formülü: hızlı doğru cevap 1000'e yakın, son saniyede ~500
  const r = Math.min(1, Math.max(0, elapsedMs / (timeSec * 1000)));
  return Math.round(1000 * (1 - r / 2));
}

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(ENC.salt), iterations: 150000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function loadQuiz() {
  let q = null;
  const raw = load(STORE_KEY);
  if (raw) { try { const d = JSON.parse(raw); if (d && Array.isArray(d.questions)) q = d; } catch (e) {} }
  if (q && q.v !== SAMPLE_V) { const pin = q.pin; q = JSON.parse(JSON.stringify(SAMPLE)); q.pin = pin; }
  if (!q) q = JSON.parse(JSON.stringify(SAMPLE));
  q.v = SAMPLE_V; delete q.logo;
  store(STORE_KEY, JSON.stringify(q));
  const OLD = { "Geon Fest × Dodo Pizza Yarışması": SAMPLE.title,
    "Geon Fest sahnesindeki hangi sanatçı İzmir doğumludur?": "Bu sanatçılardan hangisi İzmir doğumludur?",
    "Şu an içinde bulunduğumuz Tarihi Havagazı Fabrikası hangi yıl kültür merkezi olarak açıldı?": "İzmir'deki Tarihi Havagazı Fabrikası hangi yıl kültür merkezi olarak açıldı?" };
  if (OLD[q.title]) q.title = OLD[q.title];
  q.questions.forEach(x => { if (OLD[x.text]) x.text = OLD[x.text]; });
  if (!/^\d{6}$/.test(q.pin || "")) { q.pin = newPin(); store(STORE_KEY, JSON.stringify(q)); }
  return q;
}
function playerUrl() { return location.origin + location.pathname + (params.get("srv") ? "?srv=" + params.get("srv") : ""); }
let quiz = null;
function saveQuiz() { if (!store(STORE_KEY, JSON.stringify(quiz))) toast("Tarayıcı kaydetmeye izin vermedi. Sayfayı kapatmadan oynayın."); }

function validate() {
  const errs = [];
  if (!quiz.questions.length) errs.push("En az bir soru ekleyin.");
  quiz.questions.forEach((q, i) => {
    const filled = q.answers.filter(a => a.trim()).length;
    if (!q.text.trim()) errs.push(`Soru ${i + 1}: soru metni boş.`);
    else if (filled < 2) errs.push(`Soru ${i + 1}: en az iki cevap yazın.`);
    else if (!q.answers[q.correct] || !q.answers[q.correct].trim()) errs.push(`Soru ${i + 1}: doğru cevabı işaretleyin.`);
  });
  return errs;
}

function renderEditor() {
  GAME_ACTIVE = false;
  app.innerHTML = "";
  const top = h("header", { class: "ed-top" },
    brand(quiz));
  const wrap = h("main", { class: "ed-wrap" });

  const titleIn = h("input", { id: "quiz-title", class: "ed-title", value: lower(quiz.title), "aria-label": "Yarışma adı", maxlength: "80", autocapitalize: "none" });
  titleIn.addEventListener("input", () => {
    const pos = titleIn.selectionStart, up = lower(titleIn.value);
    if (up !== titleIn.value) { titleIn.value = up; try { titleIn.setSelectionRange(pos, pos); } catch (e) {} }
    quiz.title = up; saveQuiz();
  });
  const total = quiz.questions.reduce((a, q) => a + (+q.time || 20), 0);
  wrap.append(h("section", { class: "ed-hero" },
    h("div", {}, h("div", { class: "eyebrow" }, "YARIŞMANIN ADI"), titleIn,
      h("div", { class: "meta" },
        h("span", { class: "label neon" }, `${quiz.questions.length} soru`),
        h("span", { class: "label beige" }, `yaklaşık ${Math.max(1, Math.round((total + quiz.questions.length * 25) / 60))} dakika`))),
  ));

  quiz.questions.forEach((q, i) => wrap.append(questionCard(q, i)));
  wrap.append(h("button", { class: "add-q", onclick: () => {
    quiz.questions.push({ text: "", answers: ["", "", "", ""], correct: 0, time: 20 }); saveQuiz(); renderEditor();
    setTimeout(() => { const all = document.querySelectorAll(".qtext"); all[all.length - 1]?.focus(); }, 0);
  } }, "+ soru ekle"));

  const info = h("div", { class: "info", id: "start-info" }, "Sorular bu tarayıcıda otomatik kaydedilir.");
  const startBtn = h("button", { class: "btn orange big", onclick: () => {
    const errs = validate();
    if (errs.length) { info.textContent = errs[0]; info.classList.add("err"); return; }
    startHosting();
  } }, "oyun odasını aç");
  app.append(h("div", { class: "ed" }, top, wrap, h("div", { class: "start-bar" }, info, startBtn)));
}

function questionCard(q, i) {
  const card = h("section", { class: "ed-card" });
  const move = (d) => { const j = i + d; if (j < 0 || j >= quiz.questions.length) return; [quiz.questions[i], quiz.questions[j]] = [quiz.questions[j], quiz.questions[i]]; saveQuiz(); renderEditor(); };
  const timeSel = h("select", { id: `q${i}-time`, "aria-label": "Süre" },
    ...[5, 10, 15, 20, 30, 60].map(s => h("option", { value: s, selected: q.time === s }, `${s} sn`)));
  timeSel.addEventListener("change", () => { q.time = +timeSel.value; saveQuiz(); });
  card.append(h("div", { class: "qhead" },
    h("span", { class: "qno" }, String(i + 1)),
    h("span", { class: "sp" }),
    timeSel,
    h("button", { class: "ico", title: "Yukarı taşı", "aria-label": "Yukarı taşı", onclick: () => move(-1) }, "↑"),
    h("button", { class: "ico", title: "Aşağı taşı", "aria-label": "Aşağı taşı", onclick: () => move(1) }, "↓"),
    h("button", { class: "ico", title: "Kopyala", "aria-label": "Soruyu kopyala", onclick: () => { quiz.questions.splice(i + 1, 0, JSON.parse(JSON.stringify(q))); saveQuiz(); renderEditor(); } }, "⧉"),
    h("button", { class: "ico", title: "Sil", "aria-label": "Soruyu sil", onclick: () => { quiz.questions.splice(i, 1); saveQuiz(); renderEditor(); } }, "✕")
  ));
  const ta = h("textarea", { id: `q${i}-text`, class: "qtext", placeholder: "Sorunuzu yazın", maxlength: "160", "aria-label": `Soru ${i + 1} metni` });
  ta.value = q.text;
  ta.addEventListener("input", () => { q.text = ta.value; saveQuiz(); });
  card.append(ta);
  const grid = h("div", { class: "agrid" });
  q.answers.forEach((a, k) => {
    const inp = h("input", { id: `q${i}-a${k}`, class: "ainput", value: a, placeholder: k < 2 ? `Cevap ${k + 1}` : `Cevap ${k + 1} (isteğe bağlı)`, maxlength: "75", "aria-label": `Cevap ${k + 1}` });
    inp.addEventListener("input", () => { q.answers[k] = inp.value; saveQuiz(); });
    const tog = h("button", { class: "okbtn", "aria-pressed": q.correct === k ? "true" : "false", title: "Doğru cevap olarak işaretle", onclick: () => { q.correct = k; saveQuiz(); renderEditor(); } }, q.correct === k ? "doğru" : "doğru mu?");
    grid.append(h("div", { class: `aopt s${k}` }, num(k), inp, tog));
  });
  card.append(grid);
  return card;
}


/* =================================================================
   HOST — GAME
   ================================================================= */
const G = { showKey: true, peer: null, pin: "", players: new Map(), phase: "lobby", qi: -1, qStart: 0, timer: null, qs: [], lastGains: new Map(), ended: false };

function newPin() { return String(Math.floor(100000 + Math.random() * 900000)); }

function startHosting() {
  // only filled answers go to the game; keep original slot index for colors
  G.qs = quiz.questions.map(q => ({
    text: q.text.trim(), time: q.time || 20,
    slots: q.answers.map((a, k) => ({ k, text: a.trim() })).filter(s => s.text),
    correct: q.correct
  }));
  G.players.clear(); G.phase = "lobby"; G.qi = -1; G.ended = false;
  GAME_ACTIVE = true; keepAwake();
  openPeer(0);
  renderLobby();
}

async function openPeer(attempt) {
  if (G.peer) { try { G.peer.destroy(); } catch (e) {} }
  G.pin = ROOM;
  G.status = "Bağlanıyor…";
  if (typeof Peer === "undefined") { G.status = "Bağlantı kütüphanesi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin."; refreshLobby(); return; }
  await TURN_READY;
  if (G.phase !== "lobby" && !G.peer) return;
  const peer = new Peer(PREFIX + G.pin, peerOptions());
  G.peer = peer;
  peer.on("open", () => { G.status = ""; refreshLobby(true); });
  peer.on("connection", conn => wireConn(conn));
  peer.on("disconnected", () => { G.status = "Sunucu bağlantısı koptu, yeniden bağlanıyor…"; refreshLobby(); setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on("error", err => {
    if (err.type === "unavailable-id") {
      G.status = "PIN hazırlanıyor. Bu yarışma başka bir pencerede açıksa onu kapatın.";
      refreshLobby();
      if (attempt < 40) setTimeout(() => { if (G.phase === "lobby" && GAME_ACTIVE) openPeer(attempt + 1); }, 3000);
      return;
    }
    if (err.type === "peer-unavailable") return;
    if (["network", "server-error", "socket-error", "socket-closed"].includes(err.type)) {
      G.status = "Ağ sorunu, yeniden deneniyor…"; refreshLobby();
      setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e) {} }, 2500);
      return;
    }
    G.status = "Bağlantı hatası: " + err.type; refreshLobby();
  });
}

function joinUrl() { return playerUrl(); }

function wireConn(conn) {
  conn.on("data", raw => {
    let m = raw; if (typeof m === "string") { try { m = JSON.parse(m); } catch (e) { return; } }
    if (!m || typeof m !== "object") return;
    if (m.t === "join") onJoin(conn, m);
    else if (m.t === "ans") onAnswer(conn, m);
  });
  conn.on("close", () => {
    for (const p of G.players.values()) if (p.conn === conn) { p.conn = null; }
    if (G.phase === "lobby") refreshLobby(); else if (G.phase === "question") updateCounter();
  });
  conn.on("error", () => {});
}
function send(p, msg) { if (p.conn && p.conn.open) { try { p.conn.send(msg); } catch (e) {} } }
function online() { return [...G.players.values()].filter(p => p.conn && p.conn.open); }

function cleanName(n) { return String(n || "").replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁦-⁩]/g, "").replace(/\s+/g, " ").trim().slice(0, 16); }

function onJoin(conn, m) {
  const cid = String(m.cid || "").slice(0, 40);
  const name = cleanName(m.name);
  if (!cid || !name) return;
  let p = G.players.get(cid);
  const taken = [...G.players.values()].some(o => o.cid !== cid && o.name.toLocaleLowerCase("tr") === name.toLocaleLowerCase("tr"));
  if (!p && taken) { try { conn.send({ t: "nameTaken" }); } catch (e) {} return; }
  if (!p && G.ended) { try { conn.send({ t: "closed" }); } catch (e) {} return; }
  if (!p) { p = { cid, name, score: 0, streak: 0, answers: {}, conn: null }; G.players.set(cid, p); }
  else if (!taken) p.name = name;
  if (p.conn && p.conn !== conn) { try { p.conn.close(); } catch (e) {} }
  p.conn = conn;
  send(p, { t: "welcome", name: p.name, title: quiz.title });
  sendState(p);
  if (G.phase === "lobby") refreshLobby(); else if (G.phase === "question") updateCounter();
}

function ranks() {
  const arr = [...G.players.values()].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "tr"));
  const r = new Map(); arr.forEach((p, i) => r.set(p.cid, i + 1)); return { arr, r };
}

function sendState(p) {
  if (G.phase === "lobby") return send(p, { t: "lobby" });
  if (G.phase === "question") {
    const q = G.qs[G.qi];
    const remain = Math.max(0, q.time * 1000 - (Date.now() - G.qStart));
    return send(p, { t: "q", i: G.qi, n: G.qs.length, text: q.text, slots: q.slots.map(s => ({ k: s.k, text: s.text })), remain, time: q.time, answered: !!p.answers[G.qi] });
  }
  const { arr, r } = ranks();
  if (G.phase === "reveal" || G.phase === "board") {
    const a = p.answers[G.qi]; const q = G.qs[G.qi];
    return send(p, { t: "reveal", i: G.qi, n: G.qs.length, correct: !!(a && a.ok), answered: !!a, gained: a ? a.pts : 0, score: p.score, rank: r.get(p.cid), total: arr.length, streak: p.streak });
  }
  if (G.phase === "end") return send(p, { t: "end", score: p.score, rank: r.get(p.cid), total: arr.length });
}

function onAnswer(conn, m) {
  if (G.phase !== "question") return;
  const p = [...G.players.values()].find(x => x.conn === conn); if (!p) return;
  if (+m.i !== G.qi || p.answers[G.qi]) return;
  const q = G.qs[G.qi];
  const k = +m.k; if (!q.slots.some(s => s.k === k)) return;
  const ms = Date.now() - G.qStart;
  if (ms > q.time * 1000 + 600) return;
  const ok = k === q.correct;
  const pts = ok ? points(ms, q.time) : 0;
  p.answers[G.qi] = { k, ms, ok, pts };
  send(p, { t: "got" });
  updateCounter();
  const on = online();
  if (on.length && on.every(x => x.answers[G.qi])) setTimeout(() => { if (G.phase === "question") endQuestion(); }, 400);
}

function nextQuestion() {
  G.qi++;
  if (G.qi >= G.qs.length) return showEnd();
  G.phase = "question"; G.qStart = Date.now();
  const q = G.qs[G.qi];
  renderQuestion();
  for (const p of G.players.values()) sendState(p);
  clearInterval(G.timer);
  G.timer = setInterval(() => {
    const left = q.time * 1000 - (Date.now() - G.qStart);
    tickTimer(left, q.time);
    if (left <= 0) endQuestion();
  }, 100);
}

function endQuestion() {
  if (G.phase !== "question") return;
  clearInterval(G.timer);
  G.phase = "reveal";
  G.lastGains = new Map();
  for (const p of G.players.values()) {
    const a = p.answers[G.qi];
    if (a && a.ok) { p.streak++; p.score += a.pts; G.lastGains.set(p.cid, a.pts); }
    else { p.streak = 0; G.lastGains.set(p.cid, 0); }
  }
  renderReveal();
  for (const p of G.players.values()) sendState(p);
}

function showBoard() { G.phase = "board"; renderBoard(); }
function showEnd() {
  clearInterval(G.timer); G.phase = "end"; G.ended = true;
  renderPodium();
  for (const p of G.players.values()) sendState(p);
}

function getCid() {
  let c = load(CID_KEY);
  if (!c) { c = "c" + Math.random().toString(36).slice(2) + Date.now().toString(36); store(CID_KEY, c); }
  if (!load(CID_KEY)) c = P.cid || c; // storage blocked: keep per-load id
  return c;
}


async function plConnect() {
  P.cid = P.cid || getCid();
  plWait("Bağlanıyor…");
  if (typeof Peer === "undefined") { plJoin("Bağlantı kütüphanesi yüklenemedi. İnterneti kontrol edip sayfayı yenileyin."); return; }
  if (P.peer && !P.peer.destroyed && P.peer.open) return dial();
  if (P.peer) { try { P.peer.destroy(); } catch (e) {} }
  await TURN_READY;
  P.peer = new Peer(peerOptions());
  P.peer.on("open", dial);
  P.peer.on("disconnected", () => { setTimeout(() => { try { if (!P.peer.destroyed) P.peer.reconnect(); } catch (e) {} }, 1500); });
  P.peer.on("error", err => {
    if (err.type === "peer-unavailable") {
      if (P.joined && !P.done) return scheduleRetry();
      if (!P.done) return plWaitRoom();
      return;
    }
    if (P.joined && !P.done) return scheduleRetry();
    plJoin("Bağlantı kurulamadı (" + err.type + "). Tekrar deneyin.");
  });
}

function dial() {
  clearTimeout(P.retry);
  const conn = P.peer.connect(PREFIX + P.pin, { reliable: true, serialization: "json" });
  P.conn = conn;
  const guard = setTimeout(() => { if (!conn.open) { try { conn.close(); } catch (e) {} if (P.joined) scheduleRetry(); else plWaitRoom(); } }, 12000);
  conn.on("open", () => { clearTimeout(guard); conn.send({ t: "join", cid: P.cid, name: P.name }); });
  conn.on("data", m => { if (conn === P.conn) plMsg(m); });
  conn.on("close", () => { clearTimeout(guard); if (conn === P.conn && P.joined && !P.done) scheduleRetry(); });
  conn.on("error", () => {});
}
function scheduleRetry() {
  clearTimeout(P.retry);
  if (P.view !== "wait" || !document.querySelector(".big-msg")?.textContent.startsWith("Bağlantı")) plWait("Bağlantı koptu", "Yeniden bağlanıyor… Puanınız korunuyor.");
  P.retry = setTimeout(() => { if (P.peer && P.peer.open) dial(); else plConnect(); }, 2000);
}



function plMsg(m) {
  if (!m || typeof m !== "object") return;
  switch (m.t) {
    case "nameTaken": P.joined = false; try { P.conn.close(); } catch (e) {} return plJoin("Bu isim alınmış. Başka bir isim seç.");
    case "closed": P.done = true; return plStatic("Bu tur bitti", "Yeni tur açılınca sayfayı yenileyip tekrar katılabilirsin.");
    case "kicked": P.done = true; P.joined = false; return plStatic("Oyundan çıkarıldın", "Farklı bir isimle tekrar katılabilirsin.");
    case "welcome": P.rejoin = false; P.joined = true; P.name = m.name; P.title = m.title || ""; GAME_ACTIVE = true; keepAwake(); return;
    case "lobby": return plLobby();
    case "q": return plQuestion(m);
    case "got": return plSent();
    case "reveal": return plResult(m);
    case "end": P.done = true; GAME_ACTIVE = false; return plEnd(m);
  }
}

function plRejoin() {
  P.done = false; P.joined = false; P.rejoin = true;
  const c = P.conn; P.conn = null; try { c && c.close(); } catch (e) {}
  plConnect();
}
function plStatic(big, sub) {
  P.view = "wait";
  plShell("orange", h("div", { class: "center" }, h("h1", {}, big), h("p", {}, sub)));
}

function plLobby() {
  P.view = "wait";
  plShell("orange",
    h("div", { class: "center" },
      h("span", { class: "label neon", style: "align-self:flex-start" }, "katıldın"),
      P.title ? h("span", { class: "label beige", style: "align-self:flex-start;white-space:normal" }, lower(P.title)) : null,
      h("h1", { class: "big-msg" }, "Yarışma birazdan başlıyor"),
      h("p", {}, "Moderatör başlatınca ilk soru burada görünecek. Telefonun açık kalsın."),
      h("div", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i"))),
    h("div", { class: "ph-hero" }, h("div", { class: "photo", role: "img", "aria-label": "Dodo Pizza mutfağında pizza hamuru açan çalışan" })));
}

function plQuestion(m) {
  P.qi = m.i;
  if (m.answered) return plSent();
  P.view = "q"; P.picked = null;
  const slots = Array.isArray(m.slots) ? m.slots : [];
  const pad = h("div", { class: "pad" + (slots.length <= 2 ? " two" : "") }, slots.map(s => h("button", {
    class: `key s${+s.k}`, "aria-label": String(s.text),
    onclick: () => {
      P.picked = { k: +s.k, text: String(s.text) };
      try { P.conn.send({ t: "ans", i: m.i, k: +s.k }); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(30);
      plSent();
    }
  }, num(+s.k), h("span", {}, String(s.text)))));
  const cd = h("span", { class: "cd", id: "pl-cd" });
  plShell("ash",
    h("div", { class: "qmeta" }, h("span", { class: "label ring" }, `soru ${m.i + 1} / ${m.n}`), cd),
    h("div", { class: "ph-q" }, String(m.text)),
    pad);
  const end = Date.now() + (+m.remain || 0);
  const tick = () => { if (P.view !== "q" || P.qi !== m.i || !document.body.contains(cd)) return; const s = Math.max(0, Math.ceil((end - Date.now()) / 1000)); cd.textContent = s; cd.classList.toggle("low", s <= 5); if (s > 0) setTimeout(tick, 250); };
  tick();
}

function plSent() {
  P.view = "wait";
  const pk = P.picked;
  plShell("ash", h("div", { class: "center" },
    h("div", { class: "dots", "aria-hidden": "true" }, h("i"), h("i"), h("i")),
    h("h1", { class: "big-msg" }, "Cevabın alındı"),
    h("p", {}, "Herkes cevaplayınca sonucu göreceksin."),
    pk ? h("div", { class: `picked s${pk.k}` }, num(pk.k), h("span", {}, pk.text)) : null));
}

function plResult(m) {
  P.view = "res"; P.score = m.score;
  const ok = !!m.correct;
  const title = ok ? "Doğru" : (m.answered ? "Yanlış" : "Süre doldu");
  const stats = h("div", { class: "stats" },
    h("div", { class: "stat" }, h("span", { class: "k" }, "sıran"), h("span", { class: "v" }, `${m.rank} / ${m.total}`)),
    h("div", { class: "stat" }, h("span", { class: "k" }, "toplam puan"), h("span", { class: "v" }, String(m.score))));
  if (ok) {
    plShell("neon", h("div", { class: "center" },
      h("div", { class: "big" }, title),
      h("div", { class: "gainpill" }, "+" + m.gained),
      m.streak > 1 ? h("span", { class: "label ash", style: "align-self:flex-start" }, `${m.streak} soru üst üste`) : null),
      stats);
  } else {
    plShell("orange", h("div", { class: "center" },
      h("div", { class: "big" }, title),
      h("p", {}, "Bu soruda puan alamadın. Sıradaki soruya hazır ol.")),
      stats);
  }
}

function plEnd(m) {
  P.view = "end";
  const top3 = m.rank <= 3;
  plShell(top3 ? "neon" : "orange",
    h("div", { class: "center" },
      h("span", { class: "label " + (top3 ? "ash" : "neon"), style: "align-self:flex-start" }, "oyun bitti"),
      h("div", { class: "rankpill", style: top3 ? "background:var(--ash);color:var(--neon)" : "" }, String(m.rank) + "."),
      h("h1", {}, top3 ? "Podyumdasın" : "Teşekkürler"),
      h("p", {}, top3 ? "İlk üçe girdin, tebrikler." : "Bir sonraki turda yine katılabilirsin."),
      h("button", { class: "btn ash", style: "align-self:flex-start", onclick: plRejoin }, "yeni tura katıl")),
    h("div", { class: "stats" },
      h("div", { class: "stat" }, h("span", { class: "k" }, "puan"), h("span", { class: "v" }, String(m.score))),
      h("div", { class: "stat" }, h("span", { class: "k" }, "oyuncu"), h("span", { class: "v" }, String(m.total)))));
}

/* ---------- boot ---------- */
if (typeof document !== "undefined" && app) {
  if (IS_PLAYER) { P.pin = ROOM; plJoin(); }
  else bootModerator();
}
</script>
</body>
</html>
